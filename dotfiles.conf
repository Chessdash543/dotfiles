# Arquivos soltos em ~/.config/
CONFIG_FILES=(
  mimeapps.list
  user-dirs.dirs
  user-dirs.locale
  starship.toml
  wayfire.ini
  wf-shell.ini
  gtkrc
  gtkrc-2.0
  hyfetch.json
  Stochas.settings
  QtProject.conf
  Trolltech.conf
  hyprlock.conf
)

# Exclusões por app (padrões do rsync)
declare -A CONFIG_EXCLUDES=(
  [nvim]=".git/"
  [opencode]="node_modules/ service.json package-lock.json"
  [ags]="@girs/ node_modules/ package-lock.json"
  [rvmm]="logs/"
  [sublime-text]="Log/ Local/Session.sublime_session"
  [pulse]="cookie"
  [ibus]="bus/"
  [micro]="backups/ buffers/"
  [niri]="scripts/.swayidle_toggle.lock"
  [vicinae]="settings.json.bak-*"
  [systemd]="at-spi-dbus-bus.service speech-dispatcher.socket"
  [qBittorrent]="rss/ qBittorrent-data.conf watched_folders.json categories.json"
  [cairo-dock]="themes/ current_theme/icons/ current_theme/images/ current_theme/sounds/ current_theme/extras/ current_theme/preview"
  [cairo-dock-file]="themes/ current_theme/icons/ current_theme/images/ current_theme/sounds/ current_theme/extras/ current_theme/preview"
  [cairo-dock-files]="themes/ current_theme/icons/ current_theme/images/ current_theme/sounds/ current_theme/extras/ current_theme/preview"
  [cairo-dock-panel]="themes/ current_theme/icons/ current_theme/images/ current_theme/sounds/ current_theme/extras/ current_theme/preview"
  [cairo-dock-panel2]="themes/ current_theme/icons/ current_theme/images/ current_theme/sounds/ current_theme/extras/ current_theme/preview"
)

# Arquivos em $HOME/
HOME_FILES=(
  .zshrc
  .bashrc
  .profile
  .tmux.conf
)
